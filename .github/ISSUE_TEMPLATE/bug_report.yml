name: Bug report
description: Report a problem with osu!StreamDeck
title: "[Bug] "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem with osu!StreamDeck.

        Please include as much detail as possible. Do not post passwords, access tokens, or other private credentials.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem you encountered.
      placeholder: Tell us what went wrong...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: What were you doing when the problem occurred?
      placeholder: |
        1. Open...
        2. Click...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: false

  - type: textarea
    id: diagnostics
    attributes:
      label: osu!StreamDeck diagnostics
      description: Paste the diagnostics generated by osu!StreamDeck here.
      render: text
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Drag and drop any useful screenshots or videos here.
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: osu!StreamDeck version
      placeholder: e.g. 2.1.8
    validations:
      required: false

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11
    validations:
      required: false
